name: sitesearch-app
image:
  registry: gsoci.azurecr.io
  name: giantswarm/opensearch
  # used by renovate
  # repo: gsoci.azurecr.io/giantswarm/opensearch
  tag: 3.4.0

# OpenSearch configuration
opensearch:
  clusterName: sitesearch
  nodeName: sitesearch-node-1
  singleNode: true
  # Disable security for single node setup (can be enabled later)
  securityDisabled: true
  # Force clean start - removes incompatible data on startup
  forceCleanStart: false

resources:
  requests:
    cpu: 100m
    memory: 650Mi
    ephemeralStorage: 512Mi
  limits:
    cpu: 500m
    memory: 800Mi
    ephemeralStorage: 2Gi

# @schema enum:["", amd64, arm64]
# -- Target CPU architecture for this workload. Empty imposes no constraint.
# `arm64` pins the pod to arm64 nodes, adding both the `kubernetes.io/arch`
# node selector and the toleration for the `kubernetes.io/arch=arm64:NoSchedule`
# taint that Giant Swarm arm64 node pools carry. Both are required, so this
# single value sets both. The OpenSearch image is published for amd64 and
# arm64, and Lucene index data is portable between them. Do not also constrain
# `kubernetes.io/arch` through a `nodeAffinity`: that is ANDed with the node
# selector and is not visible to this value, so a contradicting one leaves the
# pod Pending.
architecture: ""

# @schema type:object;additionalProperties:{"type":"string"}
# -- Node selector for pod scheduling. Merged with `architecture`. Setting
# `kubernetes.io/arch` here to something other than `architecture` is a
# contradiction and fails the render, so set only one of the two.
nodeSelector: {}

# @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration
# -- Tolerations for pod scheduling. Merged with the toleration that
# `architecture: arm64` adds.
tolerations: []
