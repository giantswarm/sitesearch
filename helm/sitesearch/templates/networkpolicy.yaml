{{- if .Values.networkPolicy.enabled }}
# OpenSearch runs with its security plugin disabled, so the network is the only
# access control: limit ingress on 9200 to the known clients. Egress is left
# alone. Cilium still lets the kubelet's probes in from the host.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.name }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  {{- with .Values.networkPolicy.allowedClients }}
  ingress:
    - fromEndpoints:
        {{- range . }}
        {{- if or (not .namespace) (not .matchLabels) }}
        {{- fail "networkPolicy.allowedClients: every entry needs a namespace and at least one label in matchLabels" }}
        {{- end }}
        {{- if hasKey .matchLabels "io.kubernetes.pod.namespace" }}
        {{- fail "networkPolicy.allowedClients: set the namespace through `namespace`, not as a label" }}
        {{- end }}
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .namespace | quote }}
            {{- range $k, $v := .matchLabels }}
            {{ $k | quote }}: {{ $v | quote }}
            {{- end }}
        {{- end }}
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
  {{- else }}
  # No allowed clients: deny all ingress.
  ingress:
    - {}
  {{- end }}
{{- end }}
